# data/datatypes/tls_lidar/schema.yml
schema_version: 1 # lets you change the format later without breaking old files

# ── Identity ──────────────────────────────────────────────
id: tls_lidar # unique, lowercase, no spaces; used in URLs and file names
name: Terrestrial lidar # shown in the navbar and page titles
description: >
  Terrestrial laser scans of forest plots, raw files, pre-processed and post-processed files.
files: "*.csv" # which CSVs in this folder are metadata
# ── Shared dictionary: portal attribute → YOUR column name ──
shared: # REQUIRED
  datapoint_name: Scan_Name
  plot_name: Plot_name
  date: Acquisition_date
  project_id: Project_IDs

# ── Data-type-specific columns (all optional) ──
columns:
  Sensor:
    type: category
    filter: multiselect
    description: Scanner model used for acquisition
  Raw_data_folder_name:
    type: folder
    visibility: hidden
  Raw_data_path:
    type: path
    visibility: hidden
  Raw_project_name:
    type: text
    label: Raw project name
    description: Project name in Cyclone software
  Unprocessed_ptx_path:
    type: path
    visibility: hidden
  Denoised_las_path:
    type: path
    visibility: hidden
  Denoised_ptx_path:
    type: path
    visibility: hidden
  Voxelised_5cm_path:
    type: path
    description: Path to the denoised, normalised and ground removed voxelised point cloud.
    label: Voxel path

# ── Display (optional) ────────────────────────────────────
display:
  table: [Plot name, Site name, Acquisition date, Sensor type]
  popup: "{{Plot name}} · {{Sensor type}} · {{Acquisition date}}"

# ── Data access: code chunk generation ────────────────────
access:
  params: # inputs the user picks; values appear in the chunk
    product:
      label: Data product
      type: select
      options: [raw, unprocessed, voxelized]
      default: voxelized
    dest_dir:
      label: Destination folder on the server
      type: text
      default: ~/tls_pull
  templates: # one tab per template on the page
    - label: Bash
      file: template.sh
      language: bash
    - label: R
      file: template.R
      language: r
