schema_version: 1

id: JPBW
name: Jack pine budworm project
description: Studying the impact of the legacy of jack pine budworm (Choristoneura pinus pinus Freeman) defoliation on forest fuels

join_on:
  plot: Plot name
  year: Year

columns:
  Status:
    type: category
    values: [Control, Defoliation, Mortality]
    filter: multiselect
  Time since defoliation:
    type: number
    units: years
    description: Years between the end of the last recorded defoliation year and the measurement year
  Defoliation duration:
    type: number
    units: years
    description: Cumulative years of defoliation
