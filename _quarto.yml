project:
  type: website
  pre-render: src/build.R
  resources:
    - "_generated/datatypes/*"
    - "_generated/project_links.csv"
    - "_generated/projects_overview.csv"
    - "_generated/**"      # folders starting with _ aren't copied to the site otherwise

metadata-files:
  - _generated/navbar.yml

website:
  title: "DataPortal"

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true

editor: visual

